<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4f7df9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f7df9'/%3E%3Crect x='10' y='26' width='12' height='22' rx='2' fill='%23fff' opacity='.92'/%3E%3Crect x='26' y='26' width='12' height='22' rx='2' fill='%23fff' opacity='.92'/%3E%3Crect x='42' y='26' width='12' height='22' rx='2' fill='%23fff' opacity='.92'/%3E%3Ccircle cx='46' cy='18' r='7' fill='none' stroke='%23ffd9a8' stroke-width='4'/%3E%3C/svg%3E">
  <title>台账查找</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 启动画面 -->
  <div id="splash" class="splash">
    <div class="splash-logo">
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="8" y="22" width="14" height="28" rx="3" fill="rgba(255,255,255,.95)"/>
        <rect x="25" y="22" width="14" height="28" rx="3" fill="rgba(255,255,255,.8)"/>
        <rect x="42" y="22" width="14" height="28" rx="3" fill="rgba(255,255,255,.95)"/>
        <circle cx="48" cy="14" r="7" stroke="#ffd9a8" stroke-width="3.5"/>
        <path d="M44 14l3 3 5-6" stroke="#ffd9a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="splash-title">台账查找</div>
    <div class="splash-sub">三维档案定位系统</div>
    <div class="splash-loader"><span></span><span></span><span></span></div>
  </div>

  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div id="scene" aria-label="档案柜三维场景"></div>

  <button id="btnHome" class="btn-home" type="button" aria-label="恢复主界面">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5L12 3l9 7.5"></path>
      <path d="M5 9.5V21h14V9.5"></path>
      <path d="M9 21v-6h6v6"></path>
    </svg>
    <span>主页</span>
  </button>

  <button id="btnUser" class="btn-admin" type="button" aria-label="当前用户/退出登录">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"></path>
    </svg>
    <span id="userLabel">用户</span>
  </button>

  <div id="searchBar" class="search-bar hidden">
    <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>
    </svg>
    <input id="searchInput" type="text" placeholder="输入档案盒名称进行查找" autocomplete="off" enterkeyhint="search">
    <button id="btnVoice" class="voice-btn" type="button" aria-label="语音输入" title="语音输入（支持输入法语音）">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
        <path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"></path>
      </svg>
    </button>
    <button id="btnSearch" class="search-btn" type="button">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>
      </svg>
      查找
    </button>
    <div id="searchSuggest" class="search-suggest"></div>
  </div>

  <div id="boxTip" class="box-tip" hidden></div>

  <div id="toastWrap" class="toast-wrap"></div>

  <div id="overlayRoot"></div>
  <div id="panelRoot"></div>

  <script src="js/lib/three.min.js"></script>
  <script src="js/lib/OrbitControls.js"></script>
  <script src="js/lib/RoundedBoxGeometry.js"></script>
  <script src="js/lib/xlsx.full.min.js"></script>
  <script src="js/lib/mammoth.browser.min.js"></script>
  <script src="js/lib/jszip.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
